<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="420" viewBox="0 0 1140 420">
  <rect x="0" y="0" width="1140" height="420" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #222222; }
      .box { fill: #f4f6fa; stroke: #3f5c8a; stroke-width: 1.5; }
      .backend { fill: #eaf2e6; stroke: #4a7a3a; stroke-width: 1.5; }
      .hw { fill: #fdf1e0; stroke: #a2671c; stroke-width: 1.5; }
      .title { font-size: 16px; font-weight: bold; }
      .name { font-size: 14px; font-weight: bold; }
      .sub { font-size: 12px; fill: #444444; }
      .flow { font-size: 12px; fill: #333333; }
      .band { font-size: 12px; fill: #666666; }
      .line { stroke: #333333; stroke-width: 1.5; fill: none; }
      .dash { stroke: #999999; stroke-width: 1.2; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <text class="title" x="24" y="30">An Output reaches a device only through a backend it registered</text>
  <text class="band" x="24" y="54">Rendering always runs on the device's own thread, never on the app's.</text>

  <line class="dash" x1="600" y1="66" x2="600" y2="360"/>
  <text class="band" x="590" y="380" text-anchor="end">the app's thread</text>
  <text class="band" x="612" y="380">the device's thread</text>

  <!-- speaker row -->
  <rect class="box" x="20" y="78" width="175" height="76" rx="6"/>
  <text class="name" x="34" y="104">Output("speaker")</text>
  <text class="sub" x="34" y="124">44.1 or 48 kHz,</text>
  <text class="sub" x="34" y="140">stereo, a render fn</text>

  <line class="line" x1="195" y1="116" x2="306" y2="116" marker-end="url(#arrow)"/>
  <text class="flow" x="250" y="108" text-anchor="middle">open_device</text>

  <rect class="box" x="310" y="78" width="185" height="76" rx="6"/>
  <text class="name" x="324" y="104">audio::devices()</text>
  <text class="sub" x="324" y="124">the registry picks the</text>
  <text class="sub" x="324" y="140">backend for an id</text>

  <line class="line" x1="495" y1="116" x2="606" y2="116" marker-end="url(#arrow)"/>
  <text class="flow" x="550" y="108" text-anchor="middle">id = speaker</text>

  <rect class="backend" x="610" y="78" width="205" height="76" rx="6"/>
  <text class="name" x="624" y="104">Speaker backend</text>
  <text class="sub" x="624" y="124">codec + writer thread,</text>
  <text class="sub" x="624" y="140">made at the first open()</text>

  <line class="line" x1="815" y1="116" x2="926" y2="116" marker-end="url(#arrow)"/>
  <text class="flow" x="870" y="108" text-anchor="middle">1024 frames</text>

  <rect class="hw" x="930" y="78" width="190" height="76" rx="6"/>
  <text class="name" x="944" y="104">audio codec</text>
  <text class="sub" x="944" y="124">I2S DMA paces</text>
  <text class="sub" x="944" y="140">the writer</text>

  <!-- headset row -->
  <rect class="box" x="20" y="228" width="175" height="76" rx="6"/>
  <text class="name" x="34" y="254">Output("headset")</text>
  <text class="sub" x="34" y="274">44.1 kHz stereo,</text>
  <text class="sub" x="34" y="290">the only rate offered</text>

  <line class="line" x1="195" y1="266" x2="306" y2="266" marker-end="url(#arrow)"/>
  <text class="flow" x="250" y="258" text-anchor="middle">open_device</text>

  <rect class="box" x="310" y="228" width="185" height="76" rx="6"/>
  <text class="name" x="324" y="254">audio::devices()</text>
  <text class="sub" x="324" y="274">the same registry,</text>
  <text class="sub" x="324" y="290">a second backend</text>

  <line class="line" x1="495" y1="266" x2="606" y2="266" marker-end="url(#arrow)"/>
  <text class="flow" x="550" y="258" text-anchor="middle">id = headset</text>

  <rect class="backend" x="610" y="228" width="205" height="76" rx="6"/>
  <text class="name" x="624" y="254">Headset backend</text>
  <text class="sub" x="624" y="274">data callback +</text>
  <text class="sub" x="624" y="290">the link task</text>

  <line class="line" x1="815" y1="266" x2="926" y2="266" marker-end="url(#arrow)"/>
  <text class="flow" x="870" y="258" text-anchor="middle">pulls a block</text>

  <rect class="hw" x="930" y="228" width="190" height="76" rx="6"/>
  <text class="name" x="944" y="254">Bluedroid A2DP</text>
  <text class="sub" x="944" y="274">source to the</text>
  <text class="sub" x="944" y="290">headset</text>

  <text class="band" x="610" y="340">A block the device does not get renders as silence:</text>
  <text class="band" x="610" y="358">the writer and the callback keep their pace either way.</text>
</svg>
